name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff format --check . && ruff check .
      - run: mypy
      - run: |
          coverage run -m pytest -q -m "not live"
          coverage report --fail-under=85
          coverage report --include='*/cachekeeper/core/*' --fail-under=95
      - name: Install the wheel in a clean venv
        run: |
          pip wheel --no-deps -w dist .
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/cachekeeper --version
          /tmp/clean/bin/cachekeeper probe --help
