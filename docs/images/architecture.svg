</style><rect width="840" height="370" fill="var(--surface)"/><text x="24" y="38" class="t">Architecture: a pure core, adapters around it</text><text x="24" y="60" class="s">core/ imports only the standard library; tests/test_architecture.py enforces it.</text><rect x="270" y="150" width="300" height="170" fill="var(--panel)" stroke="var(--hit)" stroke-width="2"/><text x="286" y="178" class="l" font-weight="600">core/  (no I/O)</text><text x="286" y="202" class="m">prompt.py   canonical form, LCP, ring buffer</text><text x="286" y="220" class="m">classify.py cause classes, source fixes</text><text x="286" y="238" class="m">stats.py    CacheStats, inference, waste</text><text x="286" y="256" class="m">report.py   status line, report</text><text x="286" y="274" class="m">rules.py    Rule protocol (empty registry)</text><text x="286" y="292" class="m">ports.py    Backend, Storage, Clock</text><rect x="24" y="96" width="210" height="104" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="40" y="124" class="l" font-weight="600">adapters/inbound</text><text x="40" y="148" class="m">http.py  Starlette proxy,</text><text x="40" y="166" class="m">         /metrics, /health</text><text x="40" y="184" class="m">cli.py   serve report diff probe</text><rect x="606" y="96" width="210" height="104" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="622" y="124" class="l" font-weight="600">adapters/backends</text><text x="622" y="148" class="m">llamacpp.py  timings</text><text x="622" y="166" class="m">ollama.py    native + /v1</text><text x="622" y="184" class="m">lmstudio.py  TTFT inference</text><rect x="24" y="268" width="210" height="86" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="40" y="296" class="l" font-weight="600">container.py</text><text x="40" y="320" class="m">picks the implementations,</text><text x="40" y="338" class="m">detects the backend</text><rect x="606" y="268" width="210" height="86" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="622" y="296" class="l" font-weight="600">adapters/storage</text><text x="622" y="320" class="m">sqlite.py  WAL, async writer,</text><text x="622" y="338" class="m">retention</text><line x1="234" y1="148" x2="261.33205140530174" y2="178.547586864749" stroke="var(--ink3)" stroke-width="2"/><polygon points="268,186 257.6058448376762,181.88156116209814 265.05825797292727,175.21361256739988" fill="var(--ink3)"/><line x1="606" y1="148" x2="578.6679485946983" y2="178.547586864749" stroke="var(--ink3)" stroke-width="2"/><polygon points="572,186 574.9417420270728,175.21361256739988 582.3941551623237,181.88156116209814" fill="var(--ink3)"/><line x1="234" y1="311" x2="259.4920200264071" y2="295.25492880721913" stroke="var(--ink3)" stroke-width="2"/><polygon points="268,290 262.11948443001666,299.5089187940156 256.8645556227975,291.0009388204227" fill="var(--ink3)"/><line x1="606" y1="311" x2="580.5079799735929" y2="295.25492880721913" stroke="var(--ink3)" stroke-width="2"/><polygon points="572,290 583.1354443772025,291.0009388204227 577.8805155699833,299.5089187940156" fill="var(--ink3)"/></svg>
