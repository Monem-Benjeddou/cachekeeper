<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 394" width="828" height="394" role="img" aria-label="Diagram: agent to cachekeeper to local engine, with divergence detection, backend stats, status line and SQLite storage">
<style>
  svg { --surface:#fcfcfb; --panel:#f1f0ec; --line:#d9d7d0; --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a887f;
        --hit:#2a78d6; --miss:#eb6834; --term:#1a1a19; --term-ink:#e9e8e3; --term-dim:#9a988f; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --panel:#242422; --line:#3a3936; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8f8d84;
          --hit:#3987e5; --miss:#d95926; --term:#0f0f0e; --term-ink:#e9e8e3; --term-dim:#8f8d84; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .t { font-size: 18px; font-weight: 600; } .s { font-size: 13px; fill: var(--ink2); }
  .l { font-size: 13px; } .m { font-size: 12px; fill: var(--ink3); }
</style><rect width="828" height="394" fill="var(--surface)"/><text x="24" y="38" class="t">How cachekeeper sees a request</text><text x="24" y="60" class="s">Shadow mode: it watches and explains, and forwards your request bytes unchanged.</text><rect x="24" y="96" width="170" height="120" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="40" y="124" class="l" font-weight="600">Your agent</text><text x="40" y="148" class="m">Claude Code, Cline,</text><text x="40" y="166" class="m">Aider, Hermes, …</text><text x="40" y="184" class="m"></text><text x="40" y="202" class="m">/v1/chat/completions</text><rect x="264" y="86" width="300" height="140" fill="var(--panel)" stroke="var(--hit)" stroke-width="2"/><text x="280" y="114" class="l" font-weight="600">cachekeeper</text><text x="280" y="138" class="m">1  canonical prompt: system, tools, history</text><text x="280" y="156" class="m">2  longest match in the last 8 prompts</text><text x="280" y="174" class="m">3  divergence offset + the two lines</text><text x="280" y="192" class="m">4  cause: timestamp, nonce, tool order…</text><rect x="634" y="96" width="170" height="120" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="650" y="124" class="l" font-weight="600">Local engine</text><text x="650" y="148" class="m">llama.cpp</text><text x="650" y="166" class="m">Ollama</text><text x="650" y="184" class="m">LM Studio</text><line x1="194" y1="140" x2="256" y2="140" stroke="var(--ink3)" stroke-width="2"/><path d="M255,135 L264,140 L255,145 Z" fill="var(--ink3)"/><text x="229.0" y="132" class="m" text-anchor="middle">request</text><line x1="564" y1="140" x2="626" y2="140" stroke="var(--ink3)" stroke-width="2"/><path d="M625,135 L634,140 L625,145 Z" fill="var(--ink3)"/><text x="599.0" y="132" class="m" text-anchor="middle">same bytes</text><line x1="634" y1="190" x2="572" y2="190" stroke="var(--ink3)" stroke-width="2"/><path d="M573,185 L564,190 L573,195 Z" fill="var(--ink3)"/><text x="599" y="208" class="m" text-anchor="middle">stream</text><line x1="264" y1="190" x2="202" y2="190" stroke="var(--ink3)" stroke-width="2"/><path d="M203,185 L194,190 L203,195 Z" fill="var(--ink3)"/><text x="229" y="208" class="m" text-anchor="middle">unchanged</text><rect x="264" y="262" width="300" height="104" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="280" y="290" class="l" font-weight="600">5  backend truth from the response</text><text x="280" y="314" class="m">llama.cpp timings.cache_n: measured</text><text x="280" y="332" class="m">Ollama prompt_eval_duration: inferred</text><text x="280" y="350" class="m">/v1 and LM Studio: time to first token</text><line x1="414" y1="226" x2="414" y2="254" stroke="var(--ink3)" stroke-width="2"/><path d="M409,253 L414,262 L419,253 Z" fill="var(--ink3)"/><rect x="24" y="262" width="200" height="104" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="40" y="290" class="l" font-weight="600">6  status line</text><text x="40" y="314" class="m">one line per request</text><text x="40" y="332" class="m">on stdout</text><rect x="604" y="262" width="200" height="104" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="620" y="290" class="l" font-weight="600">7  SQLite, off the hot path</text><text x="620" y="314" class="m">hashes, offsets, lines,</text><text x="620" y="332" class="m">stats; bodies only with</text><text x="620" y="350" class="m">--keep-bodies</text><line x1="264" y1="314" x2="232" y2="314" stroke="var(--ink3)" stroke-width="2"/><path d="M233,309 L224,314 L233,319 Z" fill="var(--ink3)"/><line x1="564" y1="314" x2="596" y2="314" stroke="var(--ink3)" stroke-width="2"/><path d="M595,309 L604,314 L595,319 Z" fill="var(--ink3)"/></svg>
